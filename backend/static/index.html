<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🎓 Student AI Platform</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.6;background:#f7f8fa;color:#1f2328}
a{color:#3b82d4;text-decoration:none}
.hidden{display:none!important}
/* Layout */
#app{min-height:100vh}
.page{max-width:1000px;margin:0 auto;padding:24px 16px}
/* Nav */
nav{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.nav-brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.nav-links{display:flex;gap:4px}
.nav-links a,.nav-links button{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;border:none;background:none;cursor:pointer;color:#57606a;transition:background .15s}
.nav-links a:hover,.nav-links button:hover{background:#f3f4f6;color:#1f2328}
.nav-links a.active{background:#dbeafe;color:#1d4ed8}
/* Cards */
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px}
/* Stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;border-left:4px solid #3b82d4}
.stat-card.green{border-left-color:#16a34a}.stat-card.red{border-left-color:#dc2626}.stat-card.purple{border-left-color:#7c5cd8}.stat-card.orange{border-left-color:#ea580c}
.stat-label{font-size:12px;color:#57606a;margin-bottom:4px}
.stat-value{font-size:24px;font-weight:700;color:#1f2328}
.stat-sub{font-size:11px;color:#57606a;margin-top:2px}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:#3b82d4;color:#fff}.btn-primary:hover:not(:disabled){background:#2563eb}
.btn-purple{background:#7c5cd8;color:#fff}.btn-purple:hover:not(:disabled){background:#6d28d9}
.btn-green{background:#16a34a;color:#fff}.btn-green:hover:not(:disabled){background:#15803d}
.btn-orange{background:#ea580c;color:#fff}.btn-orange:hover:not(:disabled){background:#c2410c}
.btn-red{background:#dc2626;color:#fff}.btn-red:hover:not(:disabled){background:#b91c1c}
.btn-gray{background:#f3f4f6;color:#374151;border:1px solid #e5e7eb}.btn-gray:hover:not(:disabled){background:#e5e7eb}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-block{width:100%;justify-content:center}
/* Forms */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:5px}
.form-input{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:9px 12px;font-size:14px;outline:none;transition:border .15s}
.form-input:focus{border-color:#3b82d4;box-shadow:0 0 0 3px rgba(59,130,212,.1)}
.form-select{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:9px 12px;font-size:14px;background:#fff;outline:none}
/* Alerts */
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
.alert-error{background:#fee2e2;border:1px solid #fecaca;color:#b91c1c}
.alert-success{background:#dcfce7;border:1px solid #bbf7d0;color:#15803d}
.alert-info{background:#dbeafe;border:1px solid #bfdbfe;color:#1d4ed8}
.alert-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
/* Tags */
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;margin:2px}
.tag-blue{background:#dbeafe;color:#1d4ed8}.tag-red{background:#fee2e2;color:#b91c1c}.tag-green{background:#dcfce7;color:#15803d}
.tag-purple{background:#ede9fe;color:#5b21b6}.tag-orange{background:#ffedd5;color:#c2410c}.tag-gray{background:#f3f4f6;color:#374151}
/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f7f8fa;border:1px solid #e5e7eb;padding:8px 10px;text-align:left;font-weight:600;color:#57606a;font-size:11px;text-transform:uppercase}
td{border:1px solid #e5e7eb;padding:8px 10px;vertical-align:top}
/* Progress */
.progress-bar{background:#e5e7eb;border-radius:4px;height:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;background:#3b82d4;transition:width .3s}
/* Login page */
.auth-wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f8fa}
.auth-box{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:32px;width:100%;max-width:400px;box-shadow:0 4px 6px -1px rgba(0,0,0,.07)}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo .emoji{font-size:40px;display:block;margin-bottom:8px}
/* Result box */
.result-box{background:#f7f8fa;border:1px solid #e5e7eb;border-radius:8px;padding:14px;font-size:12px;font-family:monospace;overflow:auto;max-height:400px;white-space:pre-wrap;word-break:break-all}
/* Badge row */
.badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
/* Divider */
hr{border:none;border-top:1px solid #e5e7eb;margin:16px 0}
/* Chart bars (pure CSS) */
.chart-bar-wrap{display:flex;align-items:flex-end;gap:8px;height:140px;padding:0 8px}
.chart-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar{width:100%;background:#3b82d4;border-radius:4px 4px 0 0;transition:height .4s}
.chart-bar-label{font-size:10px;color:#57606a;text-align:center;word-break:break-all}
.chart-bar-val{font-size:10px;font-weight:700;color:#1f2328}
/* Section header */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-header h2{font-size:15px;font-weight:700}
/* Spinner */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #dbeafe;border-top-color:#3b82d4;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Interview */
.q-card{background:#f7f8fa;border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-bottom:12px}
.q-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;margin-right:6px}
.q-easy{background:#dcfce7;color:#15803d}.q-medium{background:#fffbeb;color:#92400e}.q-hard{background:#fee2e2;color:#b91c1c}
.q-technical{background:#dbeafe;color:#1d4ed8}.q-behavioral{background:#ede9fe;color:#5b21b6}.q-hr{background:#f3f4f6;color:#374151}
/* Score ring */
.score-ring{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;border:5px solid}
.score-good{border-color:#16a34a;color:#15803d}.score-mid{border-color:#d97706;color:#b45309}.score-low{border-color:#dc2626;color:#b91c1c}
/* Phase cards */
.phase-card{border:1px solid #e5e7eb;border-radius:10px;margin-bottom:12px;overflow:hidden}
.phase-header{padding:10px 16px;font-weight:700;font-size:13px;color:#fff}
.phase-body{padding:12px 16px}
</style>
</head>
<body>

<div id="app"></div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
const State = {
  token: localStorage.getItem('token') || '',
  user: JSON.parse(localStorage.getItem('user') || 'null'),
  page: 'login',
  loading: {},
  data: {},
};

function setUser(u) { State.user = u; localStorage.setItem('user', JSON.stringify(u)); }
function setToken(t) { State.token = t; localStorage.setItem('token', t); }
function logout() { State.token=''; State.user=null; localStorage.clear(); navigate('login'); }

// ─── Router ────────────────────────────────────────────────────────────────────
function navigate(page) {
  State.page = page;
  render();
  window.scrollTo(0,0);
}

// ─── API ──────────────────────────────────────────────────────────────────────
async function api(method, path, body, isForm) {
  const headers = {};
  if (State.token) headers['Authorization'] = 'Bearer ' + State.token;
  if (!isForm) headers['Content-Type'] = 'application/json';
  const res = await fetch(path, {
    method,
    headers,
    body: isForm ? body : (body ? JSON.stringify(body) : undefined),
  });
  if (res.status === 401) { logout(); return null; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || 'Request failed');
  return data;
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (!State.token || !State.user) {
    app.innerHTML = State.page === 'register' ? renderRegister() : renderLogin();
    attachLogin();
    return;
  }
  app.innerHTML = renderNav() + '<main>' + renderPage() + '</main>';
  attachPageHandlers();
}

function renderNav() {
  const role = State.user?.role;
  const links = [
    ['dashboard','📊 Dashboard'],
    ['skills','🔧 Skills'],
    ['career','💼 Career'],
    ['learning','🗺️ Learning Path'],
    ['resume','📄 Resume'],
    ['interview','🎤 Interview'],
  ];
  if (role === 'admin') links.push(['admin_dash','🛡️ Admin']);
  const linksHtml = links.map(([p,l]) =>
    `<a href="#" onclick="navigate('${p}');return false" class="${State.page===p?'active':''}">${l}</a>`
  ).join('');
  return `<nav>
    <div class="nav-brand"><span>🎓</span> Student AI Platform</div>
    <div class="nav-links">
      ${linksHtml}
      <button onclick="logout()">Logout</button>
    </div>
  </nav>`;
}

function renderPage() {
  switch(State.page) {
    case 'dashboard': return renderDashboard();
    case 'skills': return renderSkills();
    case 'career': return renderCareer();
    case 'learning': return renderLearning();
    case 'resume': return renderResume();
    case 'interview': return renderInterview();
    case 'admin_dash': return renderAdmin();
    default: return renderDashboard();
  }
}

// ─── Login ─────────────────────────────────────────────────────────────────────
function renderLogin() {
  return `<div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo"><span class="emoji">🎓</span><strong>Student AI Platform</strong><br><small style="color:#57606a">Sign in to your account</small></div>
      <div id="auth-error"></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="login-email" placeholder="student@example.com"/></div>
      <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="login-pwd" placeholder="••••••••"/></div>
      <button class="btn btn-primary btn-block" id="login-btn" onclick="doLogin()">Sign In</button>
      <p style="text-align:center;margin-top:14px;font-size:13px;color:#57606a">No account? <a href="#" onclick="navigate('register');return false">Register</a></p>
    </div>
  </div>`;
}

function renderRegister() {
  return `<div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo"><span class="emoji">🎓</span><strong>Create Account</strong><br><small style="color:#57606a">Join the Student AI Platform</small></div>
      <div id="auth-error"></div>
      <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" type="text" id="reg-name" placeholder="Your Name"/></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="reg-email" placeholder="student@example.com"/></div>
      <div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="reg-pwd" placeholder="Min 8 characters"/></div>
      <div class="form-group"><label class="form-label">Account Type</label>
        <select class="form-select" id="reg-role"><option value="student">Student</option><option value="admin">Admin</option></select>
      </div>
      <button class="btn btn-primary btn-block" onclick="doRegister()">Create Account</button>
      <p style="text-align:center;margin-top:14px;font-size:13px;color:#57606a">Already registered? <a href="#" onclick="navigate('login');return false">Sign In</a></p>
    </div>
  </div>`;
}

function attachLogin() {}

async function doLogin() {
  const email = document.getElementById('login-email').value;
  const pwd = document.getElementById('login-pwd').value;
  const errEl = document.getElementById('auth-error');
  try {
    const data = await api('POST','/auth/login',{email,password:pwd});
    setToken(data.access_token); setUser(data);
    navigate('dashboard');
  } catch(e) {
    errEl.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

async function doRegister() {
  const name = document.getElementById('reg-name').value;
  const email = document.getElementById('reg-email').value;
  const pwd = document.getElementById('reg-pwd').value;
  const role = document.getElementById('reg-role').value;
  const errEl = document.getElementById('auth-error');
  try {
    await api('POST','/auth/register',{name,email,password:pwd,role});
    errEl.innerHTML = `<div class="alert alert-success">✅ Account created! Please sign in.</div>`;
    setTimeout(()=>navigate('login'),1200);
  } catch(e) {
    errEl.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

// ─── Dashboard ─────────────────────────────────────────────────────────────────
function renderDashboard() {
  const d = State.data.analytics || {};
  const weakHtml = (d.weak_subjects||[]).map(s=>`<span class="tag tag-red">${s}</span>`).join('') || '<span style="color:#57606a;font-size:12px">None identified</span>';
  const bars = (d.semester_averages||[]).map(s=>{
    const h = Math.round((s.average/100)*120);
    return `<div class="chart-bar-col"><div class="chart-bar-val">${s.average}%</div><div class="chart-bar" style="height:${h}px"></div><div class="chart-bar-label">Sem ${s.semester}</div></div>`;
  }).join('');
  return `<div class="page">
    <div class="section-header"><h2>📊 Student Dashboard — ${State.user?.name}</h2>
      <button class="btn btn-gray btn-sm" onclick="loadAnalytics()">🔄 Refresh</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">CGPA</div><div class="stat-value">${d.cgpa||'—'}</div><div class="stat-sub">Cumulative Grade Point</div></div>
      <div class="stat-card green"><div class="stat-label">Total Subjects</div><div class="stat-value">${d.total_subjects||0}</div><div class="stat-sub">Academic records</div></div>
      <div class="stat-card red"><div class="stat-label">Weak Subjects</div><div class="stat-value">${(d.weak_subjects||[]).length}</div><div class="stat-sub">Below 50%</div></div>
      <div class="stat-card purple"><div class="stat-label">Semesters</div><div class="stat-value">${(d.semester_averages||[]).length}</div><div class="stat-sub">Completed</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px">
      <div class="card">
        <h2>📈 Semester Performance</h2>
        ${bars.length ? `<div class="chart-bar-wrap">${bars}</div>` : '<p style="color:#57606a;font-size:13px;text-align:center;padding:30px">Add marks to see the chart →<br><a href="#" onclick="navigate(\'skills\');return false">Add marks</a></p>'}
      </div>
      <div class="card">
        <h2>⚠️ Subjects Needing Attention</h2>
        <div style="margin-top:8px">${weakHtml}</div>
        <hr>
        <p style="font-size:12px;color:#57606a">Run AI Academic Analysis agent for detailed recommendations.</p>
      </div>
    </div>

    <div class="card">
      <h2>🤖 AI Analysis Agents</h2>
      <p style="color:#57606a;font-size:12px;margin-bottom:14px">Click any agent to run AI analysis. Add your marks and career goal first for best results.</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
        <button class="btn btn-primary" onclick="runAgent('full-pipeline','pipeline')">⚡ Full Pipeline</button>
        <button class="btn btn-purple" onclick="runAgent('analyze-performance','academic')">📊 Academic Analysis</button>
        <button class="btn" style="background:#6366f1;color:#fff" onclick="runAgent('detect-skill-gaps','skill')">🔍 Skill Gap</button>
        <button class="btn btn-green" onclick="runAgent('career-recommendations','career')">💼 Career Match</button>
        <button class="btn btn-orange" onclick="runAgent('learning-path','learning')">🗺️ Learning Path</button>
      </div>
      <div id="agent-status"></div>
      <div id="agent-result"></div>
    </div>
  </div>`;
}

async function loadAnalytics() {
  try {
    State.data.analytics = await api('GET','/academic/analytics');
    render();
  } catch(e) { /* no records yet */ }
}

async function runAgent(endpoint, key) {
  const statusEl = document.getElementById('agent-status');
  const resultEl = document.getElementById('agent-result');
  if (statusEl) statusEl.innerHTML = `<div class="alert alert-info"><span class="spinner"></span> Running ${key} agent…</div>`;
  if (resultEl) resultEl.innerHTML = '';
  try {
    const data = await api('POST', `/agents/${endpoint}`);
    if (statusEl) statusEl.innerHTML = `<div class="alert alert-success">✅ Agent completed successfully</div>`;
    if (resultEl) {
      const result = data.result || data;
      resultEl.innerHTML = renderAgentResult(key, result);
    }
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<div class="alert alert-error">❌ ${e.message}</div>`;
  }
}

function renderAgentResult(type, result) {
  if (!result || Object.keys(result).length === 0) return '';
  const preview = JSON.stringify(result, null, 2).substring(0, 2000);
  return `<div class="result-box">${preview}${preview.length >= 2000 ? '\n…(truncated)' : ''}</div>`;
}

// ─── Skills ─────────────────────────────────────────────────────────────────────
function renderSkills() {
  const skills = State.data.skills || [];
  const records = State.data.records || [];
  return `<div class="page">
    <div class="section-header"><h2>🔧 Skills & Academic Records</h2></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="card">
        <h2>Add Academic Record</h2>
        <div class="form-group"><label class="form-label">Semester</label><input class="form-input" type="number" id="sem" min="1" max="10" placeholder="1"/></div>
        <div class="form-group"><label class="form-label">Subject Code</label><input class="form-input" id="scode" placeholder="CS101"/></div>
        <div class="form-group"><label class="form-label">Subject Name</label><input class="form-input" id="sname" placeholder="Introduction to Programming"/></div>
        <div class="form-group"><label class="form-label">Marks Obtained</label><input class="form-input" type="number" id="marks" placeholder="85" min="0" max="100"/></div>
        <div class="form-group"><label class="form-label">Max Marks</label><input class="form-input" type="number" id="maxmarks" placeholder="100" value="100"/></div>
        <div class="form-group"><label class="form-label">Grade</label><input class="form-input" id="grade" placeholder="A"/></div>
        <div class="form-group"><label class="form-label">Grade Points</label><input class="form-input" type="number" id="gp" placeholder="9" step="0.1"/></div>
        <button class="btn btn-primary btn-block" onclick="addRecord()">Add Record</button>
        <div id="record-msg"></div>
      </div>

      <div class="card">
        <h2>Add Skill</h2>
        <div class="form-group"><label class="form-label">Skill Name</label><input class="form-input" id="skill-name" placeholder="Python, React, SQL…"/></div>
        <div class="form-group"><label class="form-label">Proficiency Level</label>
          <select class="form-select" id="skill-level"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select>
        </div>
        <button class="btn btn-purple btn-block" onclick="addSkill()">Add Skill</button>
        <div id="skill-msg"></div>
        <hr>
        <h2 style="margin-top:4px">Your Skills</h2>
        <div id="skills-list">
          ${skills.length ? skills.map(s=>`<span class="tag tag-blue">${s.skill_name} <small>(${s.proficiency_level})</small></span>`).join('') : '<p style="color:#57606a;font-size:12px">No skills added yet.</p>'}
        </div>
        <button class="btn btn-gray btn-sm" style="margin-top:10px" onclick="loadSkills()">🔄 Refresh</button>
      </div>
    </div>

    <div class="card">
      <h2>Academic Records</h2>
      ${records.length ? `<table><thead><tr><th>Sem</th><th>Code</th><th>Subject</th><th>Marks</th><th>%</th><th>Grade</th></tr></thead><tbody>
        ${records.map(r=>`<tr><td>${r.semester}</td><td>${r.subject_code}</td><td>${r.subject_name}</td><td>${r.marks_obtained}/${r.max_marks}</td><td>${Math.round(r.marks_obtained/r.max_marks*100)}%</td><td>${r.grade||'—'}</td></tr>`).join('')}
      </tbody></table>` : '<p style="color:#57606a;font-size:13px">No records yet. Add above.</p>'}
      <button class="btn btn-gray btn-sm" style="margin-top:10px" onclick="loadRecords()">🔄 Refresh</button>
    </div>
  </div>`;
}

async function addRecord() {
  const msgEl = document.getElementById('record-msg');
  try {
    await api('POST','/academic/records',{
      semester: parseInt(document.getElementById('sem').value),
      subject_code: document.getElementById('scode').value,
      subject_name: document.getElementById('sname').value,
      marks_obtained: parseFloat(document.getElementById('marks').value),
      max_marks: parseFloat(document.getElementById('maxmarks').value||'100'),
      grade: document.getElementById('grade').value||null,
      grade_points: parseFloat(document.getElementById('gp').value)||null,
    });
    msgEl.innerHTML = `<div class="alert alert-success" style="margin-top:8px">✅ Record added!</div>`;
    loadRecords();
  } catch(e) { msgEl.innerHTML = `<div class="alert alert-error" style="margin-top:8px">❌ ${e.message}</div>`; }
}

async function addSkill() {
  const msgEl = document.getElementById('skill-msg');
  try {
    await api('POST','/students/me/skills',{
      skill_name: document.getElementById('skill-name').value,
      proficiency_level: document.getElementById('skill-level').value,
    });
    msgEl.innerHTML = `<div class="alert alert-success" style="margin-top:8px">✅ Skill added!</div>`;
    loadSkills();
  } catch(e) { msgEl.innerHTML = `<div class="alert alert-error" style="margin-top:8px">❌ ${e.message}</div>`; }
}

async function loadSkills() {
  try { State.data.skills = await api('GET','/students/me/skills'); render(); } catch(e){}
}
async function loadRecords() {
  try { State.data.records = await api('GET','/academic/records'); render(); } catch(e){}
}

// ─── Career ────────────────────────────────────────────────────────────────────
function renderCareer() {
  const goals = State.data.goals || [];
  return `<div class="page">
    <div class="section-header"><h2>💼 Career Goals & Recommendations</h2></div>
    <div class="card">
      <h2>Set Career Goal</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
        <div class="form-group"><label class="form-label">Target Role</label><input class="form-input" id="target-role" placeholder="Software Engineer"/></div>
        <div class="form-group"><label class="form-label">Target Industry</label><input class="form-input" id="target-industry" placeholder="Technology"/></div>
        <div class="form-group"><label class="form-label">Timeline (months)</label><input class="form-input" type="number" id="timeline" placeholder="6"/></div>
      </div>
      <button class="btn btn-green" onclick="addGoal()">Save Career Goal</button>
      <div id="goal-msg"></div>
    </div>
    ${goals.length ? `<div class="card"><h2>Your Career Goals</h2>
      ${goals.map(g=>`<div style="padding:10px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px">
        <strong>${g.target_role}</strong> ${g.target_industry?`· ${g.target_industry}`:''} ${g.timeline_months?`· ${g.timeline_months} months`:''}
      </div>`).join('')}
    </div>` : ''}
    <div class="card">
      <h2>🤖 AI Career Recommendations</h2>
      <p style="color:#57606a;font-size:12px;margin-bottom:12px">Set your career goal above, then run the AI agent for personalized role recommendations.</p>
      <button class="btn btn-green" onclick="runAgentInCard('career-recommendations','career-result')">💼 Get Career Recommendations</button>
      <div id="career-result" style="margin-top:14px"></div>
    </div>
    <div class="card">
      <h2>🔍 AI Skill Gap Analysis</h2>
      <button class="btn" style="background:#6366f1;color:#fff" onclick="runAgentInCard('detect-skill-gaps','skill-result')">🔍 Analyze Skill Gaps</button>
      <div id="skill-result" style="margin-top:14px"></div>
    </div>
  </div>`;
}

async function addGoal() {
  const msgEl = document.getElementById('goal-msg');
  try {
    await api('POST','/students/me/career-goals',{
      target_role: document.getElementById('target-role').value,
      target_industry: document.getElementById('target-industry').value||null,
      timeline_months: parseInt(document.getElementById('timeline').value)||null,
    });
    msgEl.innerHTML = `<div class="alert alert-success" style="margin-top:8px">✅ Career goal saved!</div>`;
    State.data.goals = await api('GET','/students/me/career-goals');
    render();
  } catch(e) { msgEl.innerHTML = `<div class="alert alert-error" style="margin-top:8px">❌ ${e.message}</div>`; }
}

// ─── Learning Path ─────────────────────────────────────────────────────────────
function renderLearning() {
  const lp = State.data.learningPath;
  return `<div class="page">
    <div class="section-header"><h2>🗺️ Learning Path Generator</h2></div>
    <div class="card">
      <p style="color:#57606a;font-size:13px;margin-bottom:12px">The AI will create a personalized week-by-week roadmap based on your career goal and skill gaps.</p>
      <button class="btn btn-orange" onclick="generatePath()">🗺️ Generate My Learning Roadmap</button>
      <div id="path-status" style="margin-top:12px"></div>
    </div>
    ${lp ? renderLearningPathResult(lp) : ''}
  </div>`;
}

async function generatePath() {
  const statusEl = document.getElementById('path-status');
  statusEl.innerHTML = `<div class="alert alert-info"><span class="spinner"></span> Generating your personalized roadmap…</div>`;
  try {
    const data = await api('POST','/agents/learning-path');
    State.data.learningPath = data.result || data;
    render();
  } catch(e) {
    statusEl.innerHTML = `<div class="alert alert-error">❌ ${e.message}</div>`;
  }
}

function renderLearningPathResult(lp) {
  if (!lp || !lp.phases) return `<div class="card"><pre class="result-box">${JSON.stringify(lp,null,2).substring(0,2000)}</pre></div>`;
  const phaseColors = ['#3b82d4','#7c5cd8','#16a34a','#ea580c','#0d9488'];
  const phasesHtml = lp.phases.map((p,i)=>`<div class="phase-card">
    <div class="phase-header" style="background:${phaseColors[i%phaseColors.length]}">Phase ${p.phase_number}: ${p.phase_name} (Weeks ${p.weeks})</div>
    <div class="phase-body">
      <p style="font-size:12px;color:#57606a;margin-bottom:8px"><strong>Milestone:</strong> ${p.milestone||''}</p>
      <div class="badge-row">${(p.topics||[]).map(t=>`<span class="tag tag-blue">${t}</span>`).join('')}</div>
      ${(p.courses||[]).slice(0,2).map(c=>`<div style="padding:6px 0;border-top:1px solid #f3f4f6;font-size:12px">
        <strong>${c.title}</strong> · ${c.platform} · <span class="tag ${c.cost==='Free'?'tag-green':'tag-orange'}">${c.cost}</span>
      </div>`).join('')}
    </div>
  </div>`).join('');
  return `<div class="card"><h2>📋 Your ${lp.total_duration_weeks}-Week Roadmap (${lp.weekly_time_commitment_hours}h/week)</h2>${phasesHtml}</div>`;
}

// ─── Resume ─────────────────────────────────────────────────────────────────────
function renderResume() {
  const analysis = State.data.resumeAnalysis;
  return `<div class="page">
    <div class="section-header"><h2>📄 Resume Analysis</h2></div>
    <div class="card">
      <p style="color:#57606a;font-size:13px;margin-bottom:14px">Upload your PDF resume for AI-powered ATS scoring and improvement suggestions.</p>
      <div style="border:2px dashed #d1d5db;border-radius:10px;padding:24px;text-align:center;margin-bottom:12px" id="upload-area">
        <div style="font-size:32px;margin-bottom:8px">📎</div>
        <input type="file" accept=".pdf" id="resume-file" style="display:none" onchange="onFileSelect()"/>
        <label for="resume-file" style="cursor:pointer;font-size:13px;color:#3b82d4;font-weight:600">Click to select PDF resume</label>
        <div id="file-name" style="font-size:12px;color:#57606a;margin-top:4px"></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="uploadResume()">Upload & Analyze Resume</button>
      <div id="resume-msg" style="margin-top:10px"></div>
    </div>
    ${analysis ? renderResumeResult(analysis) : ''}
  </div>`;
}

function onFileSelect() {
  const f = document.getElementById('resume-file').files[0];
  if (f) document.getElementById('file-name').textContent = '📄 ' + f.name;
}

async function uploadResume() {
  const file = document.getElementById('resume-file').files[0];
  const msgEl = document.getElementById('resume-msg');
  if (!file) { msgEl.innerHTML = `<div class="alert alert-error">Please select a PDF file.</div>`; return; }
  msgEl.innerHTML = `<div class="alert alert-info"><span class="spinner"></span> Uploading & analyzing…</div>`;
  try {
    const form = new FormData(); form.append('file', file);
    const up = await fetch('/resume/upload', {method:'POST', headers:{Authorization:'Bearer '+State.token}, body:form});
    const upData = await up.json();
    if (!up.ok) throw new Error(upData.detail || 'Upload failed');
    const analysis = await api('POST', `/resume/analyze/${upData.resume_id}`);
    State.data.resumeAnalysis = analysis;
    msgEl.innerHTML = '';
    render();
  } catch(e) { msgEl.innerHTML = `<div class="alert alert-error">❌ ${e.message}</div>`; }
}

function renderResumeResult(a) {
  const score = a.ats_score || 0;
  const cls = score >= 70 ? 'score-good' : score >= 50 ? 'score-mid' : 'score-low';
  return `<div class="card">
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:16px">
      <div class="score-ring ${cls}">${score}%</div>
      <div><strong style="font-size:15px">${a.overall_rating || 'Analyzed'}</strong><br><small style="color:#57606a">${a.overall_feedback?.substring(0,100)||''}…</small></div>
    </div>
    ${a.hitl_required ? `<div class="alert alert-warn">⚠️ Flagged for counsellor review — score below threshold.</div>` : ''}
    ${a.critical_issues?.length ? `<div style="margin-bottom:12px"><strong style="font-size:13px">🔧 Critical Issues</strong><ul style="margin-top:6px;padding-left:18px;font-size:13px">${a.critical_issues.map(i=>`<li>${i}</li>`).join('')}</ul></div>` : ''}
    ${a.missing_keywords?.length ? `<div style="margin-bottom:12px"><strong style="font-size:13px">🔑 Missing Keywords</strong><div style="margin-top:6px">${a.missing_keywords.map(k=>`<span class="tag tag-red">${k}</span>`).join('')}</div></div>` : ''}
    ${a.rewritten_summary ? `<div><strong style="font-size:13px">✍️ Suggested Summary</strong><div style="background:#f0f9ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px;font-size:13px;margin-top:6px;font-style:italic">${a.rewritten_summary}</div></div>` : ''}
  </div>`;
}

// ─── Interview ─────────────────────────────────────────────────────────────────
function renderInterview() {
  const session = State.data.interviewSession;
  const currentQ = State.data.currentQ || 0;
  const eval_ = State.data.lastEval;
  if (!session) return renderInterviewSetup();
  const questions = session.result?.questions || [];
  if (!questions.length) return renderInterviewSetup();
  const q = questions[currentQ];
  const diffCls = q.difficulty==='Easy'?'q-easy':q.difficulty==='Medium'?'q-medium':'q-hard';
  const typeCls = q.type==='Technical'?'q-technical':q.type==='Behavioral'?'q-behavioral':'q-hr';
  return `<div class="page">
    <div class="section-header"><h2>🎤 Mock Interview — ${session.result?.role||'Software Engineer'}</h2>
      <button class="btn btn-gray btn-sm" onclick="State.data.interviewSession=null;State.data.lastEval=null;render()">New Session</button>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <span style="font-weight:700;font-size:13px">Question ${currentQ+1} of ${questions.length}</span>
        <span><span class="q-badge ${diffCls}">${q.difficulty}</span><span class="q-badge ${typeCls}">${q.type}</span></span>
      </div>
      <div class="q-card"><p style="font-weight:500">${q.question}</p><p style="font-size:11px;color:#57606a;margin-top:6px">Topic: ${q.topic}</p></div>
      <textarea class="form-input" id="answer-text" rows="5" placeholder="Type your answer here…" style="resize:vertical;margin-bottom:10px"></textarea>
      <div style="display:flex;gap:8px">
        <button class="btn btn-green" onclick="submitAnswer()">✅ Submit Answer</button>
        ${currentQ < questions.length-1 ? `<button class="btn btn-gray" onclick="State.data.currentQ=(State.data.currentQ||0)+1;State.data.lastEval=null;render()">Next →</button>` : ''}
      </div>
      <div id="eval-status" style="margin-top:10px"></div>
    </div>
    ${eval_ ? renderEvalResult(eval_) : ''}
  </div>`;
}

function renderInterviewSetup() {
  return `<div class="page">
    <div class="section-header"><h2>🎤 Interview Preparation</h2></div>
    <div class="card">
      <p style="color:#57606a;font-size:13px;margin-bottom:14px">Practice role-specific mock interviews with AI evaluation and feedback.</p>
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px">
        <div class="form-group"><label class="form-label">Target Role</label><input class="form-input" id="iv-role" placeholder="Software Engineer, Data Analyst…" value="Software Engineer"/></div>
        <div class="form-group"><label class="form-label">No. of Questions</label>
          <select class="form-select" id="iv-num"><option value="3">3</option><option value="5" selected>5</option><option value="7">7</option><option value="10">10</option></select>
        </div>
      </div>
      <button class="btn btn-primary btn-block" onclick="startInterview()">🎯 Start Mock Interview</button>
      <div id="iv-status" style="margin-top:10px"></div>
    </div>
  </div>`;
}

async function startInterview() {
  const statusEl = document.getElementById('iv-status');
  statusEl.innerHTML = `<div class="alert alert-info"><span class="spinner"></span> Generating interview questions…</div>`;
  try {
    const data = await api('POST','/agents/interview/start',{
      role: document.getElementById('iv-role').value,
      num_questions: parseInt(document.getElementById('iv-num').value),
    });
    State.data.interviewSession = data;
    State.data.currentQ = 0;
    State.data.lastEval = null;
    render();
  } catch(e) { statusEl.innerHTML = `<div class="alert alert-error">❌ ${e.message}</div>`; }
}

async function submitAnswer() {
  const statusEl = document.getElementById('eval-status');
  const answer = document.getElementById('answer-text').value;
  if (!answer.trim()) { statusEl.innerHTML = `<div class="alert alert-warn">Please type your answer first.</div>`; return; }
  statusEl.innerHTML = `<div class="alert alert-info"><span class="spinner"></span> Evaluating your answer…</div>`;
  try {
    const data = await api('POST','/agents/interview/evaluate',{
      session_id: State.data.interviewSession.session_id,
      question_index: State.data.currentQ || 0,
      answer,
    });
    State.data.lastEval = data;
    statusEl.innerHTML = '';
    render();
  } catch(e) { statusEl.innerHTML = `<div class="alert alert-error">❌ ${e.message}</div>`; }
}

function renderEvalResult(data) {
  const r = data.result || data;
  const score = r.score || 0;
  const cls = score >= 7 ? 'score-good' : score >= 5 ? 'score-mid' : 'score-low';
  return `<div class="card">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
      <div class="score-ring ${cls}" style="width:64px;height:64px;font-size:18px">${score}/10</div>
      <div><strong>${r.grade||'Evaluated'}</strong><br><small style="color:#57606a">${r.detailed_feedback?.substring(0,120)||''}…</small></div>
    </div>
    ${data.hitl_required ? `<div class="alert alert-warn">⚠️ Low confidence — flagged for counsellor review.</div>` : ''}
    ${r.model_answer ? `<div class="alert alert-info" style="margin-top:8px"><strong>💡 Model Answer:</strong><br><small>${r.model_answer?.substring(0,300)||''}</small></div>` : ''}
  </div>`;
}

// ─── Admin ─────────────────────────────────────────────────────────────────────
function renderAdmin() {
  const d = State.data.adminDash || {};
  const ov = d.overview || {};
  const hitl = State.data.hitlQueue || [];
  return `<div class="page">
    <div class="section-header"><h2>🛡️ Admin Dashboard</h2>
      <button class="btn btn-gray btn-sm" onclick="loadAdmin()">🔄 Refresh</button>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value">${ov.total_users||0}</div></div>
      <div class="stat-card green"><div class="stat-label">Students</div><div class="stat-value">${ov.total_students||0}</div></div>
      <div class="stat-card purple"><div class="stat-label">Agent Calls</div><div class="stat-value">${ov.total_agent_calls||0}</div></div>
      <div class="stat-card orange"><div class="stat-label">Total Cost</div><div class="stat-value">$${(ov.total_cost_usd||0).toFixed(4)}</div></div>
      <div class="stat-card red"><div class="stat-label">HITL Pending</div><div class="stat-value">${ov.hitl_pending_reviews||0}</div></div>
      <div class="stat-card"><div class="stat-label">Resumes</div><div class="stat-value">${ov.total_resumes_uploaded||0}</div></div>
    </div>
    <div class="card">
      <h2>👁️ Human-in-the-Loop Review Queue</h2>
      ${hitl.length ? `<table><thead><tr><th>Agent</th><th>Summary</th><th>Date</th><th>Action</th></tr></thead><tbody>
        ${hitl.map(item=>`<tr>
          <td><span class="tag tag-purple">${item.agent_type}</span></td>
          <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis">${item.input_summary||''}</td>
          <td>${new Date(item.created_at).toLocaleDateString()}</td>
          <td><button class="btn btn-green btn-sm" onclick="approveHitl('${item.id}')">Approve</button></td>
        </tr>`).join('')}
      </tbody></table>` : '<p style="color:#57606a;font-size:13px">No items pending review. 🎉</p>'}
    </div>
    <div class="card">
      <h2>💰 Token Usage by Provider</h2>
      <div id="token-usage-table"></div>
    </div>
  </div>`;
}

async function loadAdmin() {
  try {
    State.data.adminDash = await api('GET','/admin/dashboard');
    State.data.hitlQueue = await api('GET','/admin/hitl-queue');
    const tu = await api('GET','/admin/token-usage');
    State.data.tokenUsage = tu;
    render();
    const el = document.getElementById('token-usage-table');
    if (el && tu?.usage_by_provider?.length) {
      el.innerHTML = `<table><thead><tr><th>Provider</th><th>Model</th><th>Calls</th><th>Tokens</th><th>Cost</th></tr></thead><tbody>
        ${tu.usage_by_provider.map(u=>`<tr><td>${u.provider}</td><td>${u.model}</td><td>${u.calls}</td><td>${(u.total_input_tokens||0)+(u.total_output_tokens||0)}</td><td>$${(u.total_cost_usd||0).toFixed(6)}</td></tr>`).join('')}
      </tbody></table>`;
    } else if (el) {
      el.innerHTML = `<p style="color:#57606a;font-size:13px">No usage data yet.</p>`;
    }
  } catch(e) {}
}

async function approveHitl(id) {
  try {
    await api('POST', `/admin/hitl-queue/${id}/approve`);
    loadAdmin();
  } catch(e) {}
}

// ─── Generic helper ─────────────────────────────────────────────────────────────
async function runAgentInCard(endpoint, resultDivId) {
  const el = document.getElementById(resultDivId);
  if (el) el.innerHTML = `<div class="alert alert-info"><span class="spinner"></span> Running AI agent…</div>`;
  try {
    const data = await api('POST', `/agents/${endpoint}`);
    if (el) el.innerHTML = `<div class="result-box">${JSON.stringify(data.result||data,null,2).substring(0,3000)}</div>`;
  } catch(e) {
    if (el) el.innerHTML = `<div class="alert alert-error">❌ ${e.message}</div>`;
  }
}

// ─── Init ──────────────────────────────────────────────────────────────────────
function attachPageHandlers() {
  // Load data for relevant pages
  if (State.page === 'dashboard' && !State.data.analytics) loadAnalytics();
  if (State.page === 'skills') { if (!State.data.skills) loadSkills(); if (!State.data.records) loadRecords(); }
  if (State.page === 'career' && !State.data.goals) {
    api('GET','/students/me/career-goals').then(d=>{ State.data.goals=d; render(); }).catch(()=>{});
  }
  if (State.page === 'admin_dash' && !State.data.adminDash) loadAdmin();
}

// Keyboard shortcuts: Enter on login inputs
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const loginBtn = document.getElementById('login-btn');
    if (loginBtn) loginBtn.click();
  }
});

// Initial render
if (State.token && State.user) {
  State.page = State.user.role === 'admin' ? 'admin_dash' : 'dashboard';
}
render();
</script>
</body>
</html>
